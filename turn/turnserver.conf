# Configuração do coturn.
#
# Os valores que mudam por ambiente (IP público, usuário e senha) NÃO estão
# aqui: eles entram pelo entrypoint.sh, a partir de variáveis do Fly. Senha de
# TURN em arquivo versionado é senha pública.

listening-port=3478

# O INTERVALO DE RELAY, e por que ele é pequeno.
#
# Por padrão o coturn usa 49152-65535 — dezesseis mil portas. No Fly, cada
# porta que recebe tráfego precisa estar declarada no fly.toml, e declarar
# dezesseis mil é inviável. Quarenta bastam: cada chamada consome um punhado, e
# elas são devolvidas quando a chamada acaba.
min-port=49160
max-port=49200

# Autenticação de usuário e senha (long-term credentials). A alternativa é
# `use-auth-secret`, com credenciais temporárias geradas pelo servidor de
# realtime — mais seguro e o próximo passo natural, porque uma senha fixa que
# vaza serve para qualquer um usar o relay às nossas custas.
lt-cred-mech
realm=globo3d

# Impede que o relay seja usado para alcançar a rede interna do próprio
# servidor — sem isto, um TURN aberto vira uma porta para dentro da
# infraestrutura.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Sem TLS por enquanto: exigiria certificado, e o ganho real (atravessar rede
# corporativa que só deixa passar 443) fica para quando houver domínio próprio.
no-tls
no-dtls

# Sem a interface de administração: ela não é usada e é mais uma porta aberta.
no-cli

# Log no stdout, que é onde o Fly lê.
log-file=stdout
simple-log
