# fly.toml — ajuste 'app' para o nome que você criar com `fly launch`.
app = "meu-globo"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # O globo é renderizado no navegador; o servidor só entrega arquivos.
  size = "shared-cpu-1x"
  memory = "512mb"
