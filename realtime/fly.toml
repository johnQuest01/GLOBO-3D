# fly.toml do SERVIDOR DE REALTIME — app separado do globo.
#
# A diferença que justifica um app próprio está em três linhas aqui embaixo:
#
#   auto_stop_machines = 'off'
#   min_machines_running = 1
#
# O fly.toml do app Next tem o oposto (dorme quando ocioso, zero máquinas
# paradas), e para ele isso é ótimo — ninguém paga por um globo que ninguém
# está olhando. Para este processo seria fatal: dormir derruba TODA conexão
# WebSocket aberta e apaga a presença de quem estava online. Uma conversa
# aberta viraria "reconectando…" sem motivo visível.
#
# ESCALAR AGORA É SEGURO — desde 2026-09-12, quando o Redis entrou.
#
# Antes disso a presença vivia na memória do processo, e uma segunda máquina
# deixaria metade das pessoas invisível para a outra metade, sem erro nenhum.
# Com o Redis, a presença é compartilhada e o adapter do Socket.io faz um
# `io.to(...)` alcançar quem está conectado na outra máquina.
#
# `min_machines_running = 1` continua sendo o mínimo, não o máximo: o que não
# pode é chegar a ZERO, porque dormir derruba toda conexão aberta.

app = 'globo-realtime'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# O mesmo endpoint que o README documenta. Se ele parar de responder, a máquina
# é reiniciada — e como a presença é efêmera por natureza, reiniciar é seguro:
# o cliente reconecta e reenvia o `presence:join` sozinho.
[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '15s'
  method = 'GET'
  path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
